<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Achtergrond elementen -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d6e6" />
      <stop offset="100%" stop-color="#c9e4ca" />
    </linearGradient>
  </defs>
  
  <!-- Subtiel bloemmotief -->
  <g opacity="0.2">
    <path d="M90,110 C100,95 110,90 125,90 C140,90 150,95 160,110 C170,125 170,140 160,155 C150,170 140,175 125,175 C110,175 100,170 90,155 C80,140 80,125 90,110 Z" fill="#f7a8c9" />
    <path d="M80,100 C90,85 100,80 115,80 C130,80 140,85 150,100 C160,115 160,130 150,145 C140,160 130,165 115,165 C100,165 90,160 80,145 C70,130 70,115 80,100 Z" fill="#c9e4ca" />
    <path d="M100,120 C110,105 120,100 135,100 C150,100 160,105 170,120 C180,135 180,150 170,165 C160,180 150,185 135,185 C120,185 110,180 100,165 C90,150 90,135 100,120 Z" fill="#f7a8c9" />
  </g>
  
  <!-- Voetafdruk silhouet -->
  <g transform="translate(360, 130) scale(0.15) rotate(-15)">
    <path d="M0,0 C20,-20 60,-30 100,-30 C140,-30 170,-20 190,0 C210,20 210,50 190,80 C170,110 140,130 100,130 C60,130 30,110 10,80 C-10,50 -20,20 0,0 Z" fill="#87b38d" opacity="0.7" />
    <circle cx="35" cy="20" r="15" fill="#87b38d" opacity="0.7" />
    <circle cx="70" cy="10" r="15" fill="#87b38d" opacity="0.7" />
    <circle cx="105" cy="10" r="15" fill="#87b38d" opacity="0.7" />
    <circle cx="140" cy="15" r="15" fill="#87b38d" opacity="0.7" />
    <circle cx="170" cy="30" r="15" fill="#87b38d" opacity="0.7" />
  </g>
  
  <!-- Tekst "BlushSteps" -->
  <text x="70" y="115" font-family="Georgia, serif" font-size="52" font-weight="normal" letter-spacing="1" fill="#4a4a4a">
    Blush<tspan font-style="italic" fill="#87b38d">Steps</tspan>
  </text>
  
  <!-- Subtiele lijn onder de tekst -->
  <path d="M70,125 L430,125" stroke="url(#bg-gradient)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Tagline in Engels -->
  <text x="250" y="150" font-family="Georgia, serif" font-size="16" text-anchor="middle" font-style="italic" fill="#4a4a4a">
    premium foot photos
  </text>
</svg>
